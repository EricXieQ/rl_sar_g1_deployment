<svg xmlns="http://www.w3.org/2000/svg" width="940" height="580" viewBox="0 0 940 580" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ax" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5f6368"/>
    </marker>
  </defs>
  <rect width="940" height="580" fill="#ffffff"/>

  <text x="40" y="38" font-size="22" font-weight="bold" fill="#202124">Entry interpolation: command every tick, target every 4 ticks</text>
  <text x="40" y="62" font-size="15" fill="#5f6368">The policy re-infers every 4 ticks (20 ms). The command is recomputed every tick toward the latest target.</text>

  <!-- 4-tick gridlines (inference boundaries) -->
  <g stroke="#eceff1" stroke-width="1">
    <line x1="232" y1="160" x2="232" y2="465"/><line x1="304" y1="160" x2="304" y2="465"/>
    <line x1="376" y1="160" x2="376" y2="465"/><line x1="448" y1="160" x2="448" y2="465"/>
    <line x1="520" y1="160" x2="520" y2="465"/><line x1="592" y1="160" x2="592" y2="465"/>
    <line x1="664" y1="160" x2="664" y2="465"/>
  </g>

  <!-- switch line -->
  <line x1="160" y1="160" x2="160" y2="465" stroke="#bdc1c6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="160" y="152" font-size="12" fill="#5f6368" text-anchor="middle">switch (tick 0)</text>

  <!-- 4-tick dimension -->
  <line x1="304" y1="135" x2="376" y2="135" stroke="#4285f4" stroke-width="1.5"/>
  <line x1="304" y1="131" x2="304" y2="139" stroke="#4285f4" stroke-width="1.5"/>
  <line x1="376" y1="131" x2="376" y2="139" stroke="#4285f4" stroke-width="1.5"/>
  <text x="340" y="126" font-size="12" fill="#4285f4" text-anchor="middle" font-weight="bold">4 ticks = 20 ms = one inference</text>

  <!-- held pose -->
  <line x1="110" y1="425" x2="820" y2="425" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="824" y="429" font-size="13" fill="#5f6368">held pose</text>

  <!-- policy target: staircase, updates every 4 ticks -->
  <polyline points="160,268 232,268 232,243 304,243 304,255 376,255 376,230 448,230 448,236 520,236 520,218 592,218 592,224 664,224 664,211 736,211 820,211"
            fill="none" stroke="#4285f4" stroke-width="2.5"/>
  <text x="824" y="215" font-size="13" fill="#4285f4">policy target</text>
  <g fill="#4285f4">
    <circle cx="232" cy="243" r="4"/><circle cx="304" cy="255" r="4"/><circle cx="376" cy="230" r="4"/>
    <circle cx="448" cy="236" r="4"/><circle cx="520" cy="218" r="4"/><circle cx="592" cy="224" r="4"/>
    <circle cx="664" cy="211" r="4"/>
  </g>
  <text x="470" y="182" font-size="12" fill="#4285f4" font-weight="bold" text-anchor="middle">target updates only at these 7 points</text>

  <!-- command line + per-tick dots -->
  <polyline points="160,425 232,401 304,382 376,350 448,329 520,293 592,272 664,236 736,209 820,209"
            fill="none" stroke="#34a853" stroke-width="3"/>
  <g fill="#34a853">
    <circle cx="160" cy="425" r="2.5"/><circle cx="178" cy="419" r="2.5"/><circle cx="196" cy="413" r="2.5"/><circle cx="214" cy="407" r="2.5"/>
    <circle cx="232" cy="401" r="2.5"/><circle cx="250" cy="396" r="2.5"/><circle cx="268" cy="391" r="2.5"/><circle cx="286" cy="386" r="2.5"/>
    <circle cx="304" cy="382" r="2.5"/><circle cx="322" cy="374" r="2.5"/><circle cx="340" cy="366" r="2.5"/><circle cx="358" cy="358" r="2.5"/>
    <circle cx="376" cy="350" r="2.5"/><circle cx="394" cy="345" r="2.5"/><circle cx="412" cy="339" r="2.5"/><circle cx="430" cy="334" r="2.5"/>
    <circle cx="448" cy="329" r="2.5"/><circle cx="466" cy="320" r="2.5"/><circle cx="484" cy="311" r="2.5"/><circle cx="502" cy="302" r="2.5"/>
    <circle cx="520" cy="293" r="2.5"/><circle cx="538" cy="288" r="2.5"/><circle cx="556" cy="283" r="2.5"/><circle cx="574" cy="277" r="2.5"/>
    <circle cx="592" cy="272" r="2.5"/><circle cx="610" cy="263" r="2.5"/><circle cx="628" cy="254" r="2.5"/><circle cx="646" cy="245" r="2.5"/>
    <circle cx="664" cy="236" r="2.5"/><circle cx="682" cy="229" r="2.5"/><circle cx="700" cy="223" r="2.5"/><circle cx="718" cy="216" r="2.5"/>
    <circle cx="736" cy="209" r="4"/>
  </g>
  <text x="455" y="375" font-size="13" font-weight="bold" fill="#188038" transform="rotate(-21 455 375)">one green dot per tick (command recomputed every tick)</text>
  <text x="736" y="200" font-size="13" font-weight="bold" fill="#188038" text-anchor="middle">&#945;=1: lands on the live target</text>

  <!-- x axis -->
  <line x1="110" y1="475" x2="820" y2="475" stroke="#5f6368" stroke-width="1.5" marker-end="url(#ax)"/>
  <g stroke="#5f6368" stroke-width="1.5">
    <line x1="160" y1="471" x2="160" y2="479"/><line x1="448" y1="471" x2="448" y2="479"/><line x1="736" y1="471" x2="736" y2="479"/>
  </g>
  <text x="160" y="494" font-size="12" fill="#3c4043" text-anchor="middle">0</text>
  <text x="448" y="494" font-size="12" fill="#3c4043" text-anchor="middle">16</text>
  <text x="736" y="494" font-size="12" fill="#3c4043" text-anchor="middle">32</text>
  <text x="770" y="494" font-size="12" fill="#5f6368">PD ticks</text>

  <!-- code box -->
  <rect x="40" y="514" width="860" height="50" rx="8" fill="#1e1e1e"/>
  <text x="58" y="537" font-size="14" fill="#d4d4d4" font-family="Menlo, Consolas, monospace">every tick:  <tspan fill="#dcdcaa">command</tspan> = (1 &#8722; alpha)&#183;<tspan fill="#9cdcfe">held</tspan> + alpha&#183;<tspan fill="#9cdcfe">target</tspan>;   alpha = tick / 32</text>
  <text x="58" y="555" font-size="14" fill="#d4d4d4" font-family="Menlo, Consolas, monospace">every 4 ticks:  <tspan fill="#9cdcfe">target</tspan> = latest policy output   <tspan fill="#6a9955">// new inference (20 ms)</tspan></text>
</svg>
